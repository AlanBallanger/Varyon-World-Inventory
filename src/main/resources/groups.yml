# Varyon-World-Inventory — Configuration des groupes de mondes
#
# Les mondes d'un même groupe partagent le même inventaire.
# Le premier monde de chaque groupe sert de clé de sauvegarde (détail interne).
#
# Format :
# groups:
#   nom-du-groupe:
#     - monde_1
#     - monde_2
#
# Exemple :
# groups:
#   survie:
#     - Overworld
#     - Nether
#     - End

groups:
  adventurers:
    - Varyon
    - Haven

  creative:
    - Creative
    - Flat
